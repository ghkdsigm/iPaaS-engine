services:
  postgres:
    image: postgres:16
    container_name: company-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-company}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-company_pw}
      POSTGRES_DB: ${POSTGRES_DB:-company_automation}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-company} -d ${POSTGRES_DB:-company_automation}"]
      interval: 5s
      timeout: 5s
      retries: 20

  hr-mcp-server:
    build:
      context: ./mcp-servers/hr-mcp-server
    container_name: hr-mcp
    environment:
      PORT: ${HR_MCP_PORT:-4001}
    ports:
      - "${HR_MCP_PORT:-4001}:${HR_MCP_PORT:-4001}"

  orchestrator:
    build:
      context: ./apps/orchestrator
    container_name: orchestrator
    environment:
      PORT: ${ORCHESTRATOR_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://company:company_pw@postgres:5432/company_automation?schema=public}
      HR_MCP_BASE_URL: http://hr-mcp-server:${HR_MCP_PORT:-4001}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
    depends_on:
      postgres:
        condition: service_healthy
      hr-mcp-server:
        condition: service_started
    ports:
      - "${ORCHESTRATOR_PORT:-3001}:${ORCHESTRATOR_PORT:-3001}"

  frontend:
    build:
      context: ./apps/frontend
    container_name: frontend
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:${NGINX_PORT:-8080}/api
    depends_on:
      orchestrator:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: company-nginx
    depends_on:
      frontend:
        condition: service_started
      orchestrator:
        condition: service_started
      hr-mcp-server:
        condition: service_started
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/nginx/sites-enabled/company-automation.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
