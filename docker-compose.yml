services:
  postgres:
    image: postgres:16
    container_name: company-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-company}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-company_pw}
      POSTGRES_DB: ${POSTGRES_DB:-company_automation}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-company} -d ${POSTGRES_DB:-company_automation}"]
      interval: 5s
      timeout: 5s
      retries: 20

  hr-mcp-server:
    build:
      context: ./mcp-servers/hr-mcp-server
    container_name: hr-mcp
    environment:
      PORT: ${HR_MCP_PORT:-4001}
    ports:
      - "${HR_MCP_PORT:-4001}:${HR_MCP_PORT:-4001}"


  finance-mcp-server:
    build:
      context: ./mcp-servers/finance-mcp-server
    container_name: finance-mcp
    environment:
      PORT: ${FINANCE_MCP_PORT:-4011}
    ports:
      - "${FINANCE_MCP_PORT:-4011}:${FINANCE_MCP_PORT:-4011}"

  dispatch-mcp-server:
    build:
      context: ./mcp-servers/dispatch-mcp-server
    container_name: dispatch-mcp
    environment:
      PORT: ${DISPATCH_MCP_PORT:-4021}
    ports:
      - "${DISPATCH_MCP_PORT:-4021}:${DISPATCH_MCP_PORT:-4021}"

  ledger-mcp-server:
    build:
      context: ./mcp-servers/ledger-mcp-server
    container_name: ledger-mcp
    environment:
      PORT: ${LEDGER_MCP_PORT:-4031}
    ports:
      - "${LEDGER_MCP_PORT:-4031}:${LEDGER_MCP_PORT:-4031}"

  orchestrator:
    build:
      context: ./apps/orchestrator
    container_name: orchestrator
    environment:
      PORT: ${ORCHESTRATOR_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL}
      HR_MCP_BASE_URL: http://hr-mcp-server:${HR_MCP_PORT:-4001}
      FINANCE_MCP_BASE_URL: http://finance-mcp-server:${FINANCE_MCP_PORT:-4011}
      DISPATCH_MCP_BASE_URL: http://dispatch-mcp-server:${DISPATCH_MCP_PORT:-4021}
      LEDGER_MCP_BASE_URL: http://ledger-mcp-server:${LEDGER_MCP_PORT:-4031}
      PII_VAULT_KEY: ${PII_VAULT_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
    depends_on:
      postgres:
        condition: service_healthy
      hr-mcp-server:
        condition: service_started
    ports:
      - "${ORCHESTRATOR_PORT:-3001}:${ORCHESTRATOR_PORT:-3001}"

  frontend:
    build:
      context: ./apps/frontend
    container_name: frontend
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:${NGINX_PORT:-8080}/api
    depends_on:
      orchestrator:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: company-nginx
    depends_on:
      frontend:
        condition: service_started
      orchestrator:
        condition: service_started
      hr-mcp-server:
        condition: service_started
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/nginx/sites-enabled/company-automation.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
